name: Drafted PR

# Pull requests from drafts/ branches (the Looma docs bot): labelled `drafted` and no links to
# other getLooma repositories (design.md D18). No approval is required: only the Looma team can
# merge, and merging is the review (change drafts-merge-by-members). No secrets; the job only
# reads the pull request event.
on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: drafted-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  drafted-pr:
    name: drafted-pr
    if: startsWith(github.event.pull_request.head.ref, 'drafts/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }} # the check code from main, never the PR's
          persist-credentials: false
      - name: Check label and body
        run: node scripts/check-drafted-pr.mjs
