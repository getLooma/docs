version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Versions at least 14 days old only, matching the pinning rule (docs-site design).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "starlight-*", "astro-*"]
      tooling:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Versions at least 14 days old only, matching the pinning rule (docs-site design).
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Versions at least 14 days old only, matching the pinning rule (docs-site design).
    cooldown:
      default-days: 14
